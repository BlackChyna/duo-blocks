<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DUO BLOCKS — original 2×2 gradient block glyph -->
  <defs>
    <linearGradient id="dbViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="dbCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="dbCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="dbYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B1026"/>
  <rect x="7" y="7" width="25" height="25" rx="7" fill="url(#dbViolet)"/>
  <rect x="36" y="7" width="21" height="21" rx="6" fill="url(#dbCyan)"/>
  <rect x="7" y="36" width="21" height="21" rx="6" fill="url(#dbCoral)"/>
  <rect x="32" y="32" width="25" height="25" rx="7" fill="url(#dbYellow)"/>
</svg>
